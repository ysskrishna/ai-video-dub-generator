[project]
name = "ai-video-dub-generator-backend"
version = "0.1.0"
description = "AI-powered backend service for automatic video dubbing from one language to another using speech recognition, translation, and text-to-speech technologies.Powered by Deepgram for speech recognition, OpenAI for translation, and ElevenLabs for lifelike voiceovers, this frontend application helps content creators, educators, and businesses reach global audiences effortlessly."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Y. Siva Sai Krishna", email = "sivasaikrishnassk@gmail.com"}
]
keywords = [
    "ai",
    "video",
    "dubbing",
    "translation",
    "speech-to-text",
    "text-to-speech",
    "deepgram",
    "openai",
    "elevenlabs",
    "fastapi",
    "moviepy",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.23",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "yt-dlp>=2025.9.26",
    "moviepy>=2.2.1",
    "deepgram-sdk>=5.0.0",
    "openai>=2.3.0",
    "elevenlabs>=2.17.0",
]

[project.urls]
Homepage = "https://github.com/ysskrishna/ai-video-dub-generator"
Repository = "https://github.com/ysskrishna/ai-video-dub-generator"
Documentation = "https://github.com/ysskrishna/ai-video-dub-generator#readme"
Issues = "https://github.com/ysskrishna/ai-video-dub-generator/issues"
"Bug Tracker" = "https://github.com/ysskrishna/ai-video-dub-generator/issues"
